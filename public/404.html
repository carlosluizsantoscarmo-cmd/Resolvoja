<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada · Resolvo Já</title>
<style>
:root{--bg:#F3F5FC;--surface:#fff;--text:#121A3A;--muted:#566080;--line:#D9DDEE;--brand:#1F3BD1;--brand-ink:#fff;--sun:#FFC400}
@media (prefers-color-scheme:dark){:root{--bg:#0D1230;--surface:#151B3E;--text:#EEF0FA;--muted:#A3ABCF;--line:#283062;--brand:#8FA2FF;--brand-ink:#0D1230}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
.card{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
.logo{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:14px;background:var(--brand);color:var(--sun);font:800 26px Arial,sans-serif;margin-bottom:14px}
.code{font-size:54px;font-weight:800;line-height:1;margin:4px 0 6px;color:var(--brand)}
h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);margin:0 0 20px}
a.btn{display:inline-block;padding:13px 22px;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:700;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">RJ</div>
  <div class="code">404</div>
  <h1>Não achamos essa página</h1>
  <p>O endereço pode ter mudado ou estar digitado errado. Volte para o início e faça seu cadastro na lista de espera.</p>
  <a class="btn" href="/">Ir para o início</a>
</main>
<script src="/config.js"></script>
<script src="/site.js"></script>
</body>
</html>
