<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagamento · Resolvo Já</title>
<style>
:root{--bg:#F3F5FC;--surface:#fff;--text:#121A3A;--muted:#566080;--line:#D9DDEE;--brand:#1F3BD1;--ok:#0E7A52;--warn:#8A5A00;--err:#A12626}
@media (prefers-color-scheme:dark){:root{--bg:#0D1230;--surface:#151B3E;--text:#EEF0FA;--muted:#A3ABCF;--line:#283062;--brand:#8FA2FF;--ok:#6FD6A8;--warn:#FFC857;--err:#FF9B9B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 48px}
a.brand{color:var(--text);font-weight:800;text-decoration:none;font-size:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}
h1{font-size:24px;margin:0 0 8px}
a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
<a class="brand" href="/">Resolvo Já</a>
<div class="card" role="status" aria-live="polite"><h1 id="t">Conferindo o pagamento…</h1><p id="p">Só um instante.</p></div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search),id=q.get('pedido')||'',tries=0;
  var t=document.getElementById('t'),p=document.getElementById('p');
  function show(h,msg,color){t.textContent=h;p.textContent=msg;t.style.color=color||''}
  // O status da URL pode ser alterado por qualquer pessoa; só o servidor (que recebeu o aviso do Mercado Pago) vale.
  function check(){
    fetch('/api/pedido?id='+encodeURIComponent(id)).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(d){
      if(d.status==='paid'){show('Pagamento confirmado','Obrigado! Vamos falar com você pelo e-mail informado.','var(--ok)');return}
      if(d.status==='rejected'||d.status==='cancelled'){show('Pagamento não aprovado','O Mercado Pago não aprovou. Você pode tentar de novo.','var(--err)');p.innerHTML+=' <a href="/pagar.html">Tentar de novo</a>';return}
      if(++tries<8){setTimeout(check,3000);return}
      show('Aguardando confirmação','Ainda não recebemos a confirmação. Pix e boleto podem levar alguns minutos. Você não precisa pagar de novo.','var(--warn)');
    }).catch(function(){show('Não encontramos o pedido','Se você pagou, guarde o comprovante e fale com a gente.','var(--err)')});
  }
  if(!/^[0-9a-f-]{36}$/.test(id)){show('Pedido não encontrado','Volte ao site e tente de novo.','var(--err)')}else{check()}
})();
</script>
</body>
</html>
