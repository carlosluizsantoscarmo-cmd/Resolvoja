<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Resolvo Já</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/app/app-config.js"></script>
<script>
/* Para usar com dados reais, preencha as duas linhas abaixo (Supabase > Project Settings > API).
   A chave "anon" pode ficar aqui: quem manda é a segurança por linha do banco. NUNCA coloque a chave service_role. */
/* A URL e a chave pública vêm do mesmo arquivo do app (/app/app-config.js): preencha só lá. */
window.RESOLVO_JA_CONFIG = { supabaseUrl: (window.RJ_APP||{}).url || "", supabaseAnonKey: (window.RJ_APP||{}).anonKey || "" };
</script>
<style>
:root{
  --bg:#F3F5FC;--surface:#FFFFFF;--text:#121A3A;--muted:#566080;--line:#D9DDEE;--soft:#E3E8FB;
  --brand:#1F3BD1;--brand-ink:#FFFFFF;--sun:#FFC400;--sun-ink:#121A3A;
  --ok:#0E7A52;--ok-bg:#DDF3EA;--warn:#8A4B06;--warn-bg:#FDEBCF;--err:#A12626;--err-bg:#FBE3E3;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1230;--surface:#151B3E;--text:#EEF0FA;--muted:#A3ABCF;--line:#283062;--soft:#1F2757;
    --brand:#8FA2FF;--brand-ink:#0D1230;--ok:#6FD6A8;--ok-bg:#12382B;--warn:#F6C47A;--warn-bg:#3F2B0E;--err:#FF9B9B;--err-bg:#431B1B;color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#0D1230;--surface:#151B3E;--text:#EEF0FA;--muted:#A3ABCF;--line:#283062;--soft:#1F2757;
  --brand:#8FA2FF;--brand-ink:#0D1230;--ok:#6FD6A8;--ok-bg:#12382B;--warn:#F6C47A;--warn-bg:#3F2B0E;--err:#FF9B9B;--err-bg:#431B1B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{font:800 22px var(--f-display);letter-spacing:-.02em;display:flex;gap:5px}
.logo b{background:var(--sun);color:var(--sun-ink);padding:0 8px 2px;border-radius:10px 10px 10px 3px}
.tag{font-weight:700;font-size:13px;background:var(--soft);color:var(--brand);padding:3px 10px;border-radius:999px}
.sp{flex:1}
.demo{background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:14px;padding:8px 0;text-align:center}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
.tab{flex:none;border:0;background:none;color:var(--muted);font:700 15px var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--soft);color:var(--brand)}
.count{font-size:12.5px;background:var(--err);color:var(--surface);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.count.zero{background:var(--line);color:var(--muted)}
main{padding-block:24px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:26px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.kpi span{display:block;color:var(--muted);font-size:14px;font-weight:600}
.kpi b{display:block;font:800 28px var(--f-display);letter-spacing:-.02em;margin-top:2px}
h2{font-size:24px;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 16px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th{text-align:left;padding:11px 14px;background:var(--bg);color:var(--muted);font-size:13.5px;font-weight:700;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)} .pill.info{background:var(--soft);color:var(--brand)}
.btn{border:0;border-radius:10px;padding:9px 14px;font:700 14.5px var(--f-body);cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:6px;flex-wrap:wrap}
select,input,textarea{font:500 15px var(--f-body);color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw}
.toast.err{background:var(--err);color:#fff}
.login{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px}
.login label{display:block;font-weight:700;font-size:14.5px;margin:14px 0 6px}
.login input{width:100%}
.login .btn{width:100%;margin-top:18px;padding:12px}
.msg{margin-top:12px;color:var(--err);font-weight:600;min-height:1.4em}
.resolve{display:grid;gap:6px;min-width:230px}
@media (max-width:640px){.wrap{padding-inline:16px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var CFG = window.RESOLVO_JA_CONFIG || {};
  var LIVE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
  var $app = document.getElementById('app');
  var state = { tab:'visao', pros:[], reqs:[], disputes:[], payouts:[], negs:[], audit:[], cats:[], regs:[], reports:[], ov:null, user:null };

  /* ---------------------------------------------------------- utilidades */
  function esc(s){ var d=document.createElement('div'); d.textContent = s==null ? '' : String(s); return d.innerHTML; }
  function money(c){ return (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function when(iso){ var d=new Date(iso); return isNaN(d) ? '' : d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  var STATUS_REQ = { open:['Aberto','info'], awaiting_payment:['Aguardando pagamento','warn'], hired:['Contratado','info'], completed:['Concluído','ok'], cancelled:['Cancelado','err'], disputed:['Em disputa','err'] };
  var STATUS_PAYOUT = { requested:['Pedido','warn'], paid:['Pago','ok'], failed:['Recusado','err'] };
  var STATUS_DISPUTE = { open:['Aberta','err'], resolved_refund:['Reembolsada','info'], resolved_partial:['Parcial','info'], resolved_release:['Liberada','ok'] };
  var STATUS_REPORT = { open:['Aberta','err'], reviewing:['Em análise','warn'], dismissed:['Arquivada','info'], actioned:['Resolvida','ok'] };
  var STATUS_PRO = { pending:['Pendente','warn'], approved:['Aprovado','ok'], suspended:['Suspenso','err'] };
  function pill(map,k){ var m=map[k]||[k,'info']; return '<span class="pill '+m[1]+'">'+esc(m[0])+'</span>'; }
  function toast(msg,isErr){
    Array.prototype.forEach.call(document.querySelectorAll('.toast'), function(x){ x.remove(); });
    var t=document.createElement('div'); t.className='toast'+(isErr?' err':''); t.setAttribute('role','status'); t.textContent=msg;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3200);
  }

  /* ---------------------------------------------------------- dados de demonstração */
  var demo = {
    pros:[
      {user_id:'p1',name:'Rodrigo Pires',phone:'(27) 9 9911-2233',status:'pending',years_exp:6,categories:'Eletricista',accepted_terms:true,document_path:'documentos/p1/rg.jpg',created_at:'2026-10-02T09:10:00Z'},
      {user_id:'p2',name:'Luciana Torres',phone:'(27) 9 9822-4411',status:'pending',years_exp:3,categories:'Montador',accepted_terms:true,document_path:'documentos/p2/rg.jpg',created_at:'2026-10-02T06:40:00Z'},
      {user_id:'p3',name:'Edmilson Barros',phone:'(27) 9 9733-0099',status:'pending',years_exp:12,categories:'Encanador',accepted_terms:false,document_path:'documentos/p3/rg.jpg',created_at:'2026-10-01T18:05:00Z'},
      {user_id:'p4',name:'Marcos Vinícius',phone:'(27) 9 9644-8800',status:'approved',years_exp:8,categories:'Montador',accepted_terms:true,document_path:'documentos/p4/rg.jpg',created_at:'2026-09-20T11:00:00Z'}
    ],
    reqs:[
      {id:'r1',title:'Montar guarda-roupa de 6 portas',status:'hired',created_at:'2026-10-02T10:02:00Z',categories:{name:'Montador'}},
      {id:'r2',title:'Trocar chuveiro elétrico',status:'open',created_at:'2026-10-02T09:30:00Z',categories:{name:'Eletricista'}},
      {id:'r3',title:'Vazamento na pia da cozinha',status:'disputed',created_at:'2026-09-30T15:12:00Z',categories:{name:'Encanador'}},
      {id:'r4',title:'Instalar prateleiras e nichos',status:'completed',created_at:'2026-09-28T08:45:00Z',categories:{name:'Montador'}}
    ],
    disputes:[
      {id:'d1',reason:'O vazamento voltou no dia seguinte ao serviço.',status:'open',created_at:'2026-10-01T20:00:00Z',service_requests:{title:'Vazamento na pia da cozinha'}}
    ],
    negs:[
      {request_id:'n1',title:'Vazamento na pia',category:'Encanador',bairro:'Laranjeiras',status:'awaiting_payment',amount_cents:15000,eta:'Amanhã à tarde',accepted_at:'2026-10-03T14:10:00Z',client_name:'Ana Souza',client_phone:'(27) 9 9999-0000',pro_name:'Edmilson Barros',pro_phone:'(27) 9 9733-0099'},
      {request_id:'n2',title:'Montar guarda-roupa de 6 portas',category:'Montador',bairro:'Jardim Limoeiro',status:'hired',amount_cents:16000,eta:'Sábado, 9h',accepted_at:'2026-10-02T10:02:00Z',client_name:'Paula Lima',client_phone:'(27) 9 9811-2200',pro_name:'Marcos Vinícius',pro_phone:'(27) 9 9644-8800'}
    ],
    cats:[{id:1,name:'Eletricista',active:true},{id:2,name:'Encanador',active:true},{id:3,name:'Pintor',active:false}],
    regs:[{id:1,city:'Serra',name:'Laranjeiras',active:true},{id:2,city:'Vitória',name:'Jardim da Penha',active:false}],
    reports:[{id:'rp1',status:'open',reason:'O profissional não compareceu no horário combinado.',created_at:'2026-10-03T12:00:00Z',reporter_name:'Ana Souza',reporter_phone:'(27) 9 9999-0000',target_name:'Edmilson Barros',target_phone:'(27) 9 9733-0099',request_title:'Vazamento na pia'}],
    ov:{orders_week:12,orders_prev_week:9,orders_30d:40,with_proposal_pct:75,hires_30d:18,hires_pct:45,gmv_cents:420000,commission_cents:42000,hired_clients:10,repeat_clients:2,repeat_pct:20,pros_approved:8,pros_pending:3,clients_total:30,reports_open:1},
    payouts:[
      {id:'s1',amount_cents:16200,pix_key:'marcos@exemplo.com',status:'requested',requested_at:'2026-10-02T08:20:00Z',pro_profiles:{profiles:{name:'Marcos Vinícius'}}},
      {id:'s2',amount_cents:9000,pix_key:'(27) 9 9644-8800',status:'paid',requested_at:'2026-09-29T10:00:00Z',pro_profiles:{profiles:{name:'Marcos Vinícius'}}}
    ]
  };

  /* ---------------------------------------------------------- acesso aos dados */
  var api;
  if(!LIVE){
    api = {
      login:function(){ return Promise.resolve({name:'Equipe Resolvo Já (demonstração)'}); },
      logout:function(){ return Promise.resolve(); },
      load:function(){ state.pros=demo.pros; state.reqs=demo.reqs; state.disputes=demo.disputes; state.payouts=demo.payouts; state.negs=demo.negs; state.cats=demo.cats; state.regs=demo.regs; state.reports=demo.reports; state.ov=demo.ov; return Promise.resolve(); },
      docUrl:function(){ return Promise.reject(new Error('No modo demonstração não há documentos.')); },
      markPaid:function(id){ demo.negs.forEach(function(n){ if(n.request_id===id) n.status='hired'; }); return Promise.resolve(); },
      setPro:function(id,status){ demo.pros.forEach(function(p){ if(p.user_id===id) p.status=status; }); return Promise.resolve(); },
      resolve:function(id,outcome){
        demo.disputes.forEach(function(d){ if(d.id===id) d.status=outcome; });
        demo.reqs.forEach(function(r){ if(r.status==='disputed') r.status = outcome==='resolved_refund' ? 'cancelled' : 'completed'; });
        return Promise.resolve();
      },
      payout:function(id,status){ demo.payouts.forEach(function(p){ if(p.id===id) p.status=status; }); return Promise.resolve(); },
      addCat:function(n){ demo.cats.push({id:Date.now(),name:n,active:true}); return Promise.resolve(); },
      addReg:function(c,n){ demo.regs.push({id:Date.now(),city:c,name:n,active:true}); return Promise.resolve(); },
      toggle:function(t,id,on){ (t==='cat'?demo.cats:demo.regs).forEach(function(x){ if(x.id===id) x.active=on; }); return Promise.resolve(); },
      report:function(id,st){ demo.reports.forEach(function(r){ if(r.id===id) r.status=st; }); return Promise.resolve(); }
    };
  } else {
    var sb = null;
    var need = function(r){ if(r.error) throw new Error(r.error.message); return r.data; };
    api = {
      init:function(){
        return new Promise(function(res,rej){
          var s=document.createElement('script');
          s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
          s.onload=function(){ sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{experimental:{passkey:true}}}); res(); };
          s.onerror=function(){ rej(new Error('Não foi possível carregar a biblioteca do Supabase.')); };
          document.head.appendChild(s);
        });
      },
      checkAdmin:function(userId){
        return sb.from('profiles').select('name,role').eq('id', userId).single().then(function(p){
          if(p.error || !p.data || p.data.role!=='admin'){ return sb.auth.signOut().then(function(){ throw new Error('Esta conta não faz parte da equipe.'); }); }
          return {name:p.data.name};
        });
      },
      login:function(email,pass){
        return sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
          if(r.error) throw new Error('E-mail ou senha incorretos.');
          return api.checkAdmin(r.data.user.id);
        });
      },
      loginPasskey:function(){
        if(!sb.auth.signInWithPasskey) return Promise.reject(new Error('Este navegador ou esta versão ainda não suporta Face ID. Entre com e-mail e senha.'));
        return sb.auth.signInWithPasskey().then(function(r){
          if(r.error) throw new Error('Não foi possível entrar com Face ID. Entre com e-mail e senha.');
          var uid = (r.data && ((r.data.user && r.data.user.id) || (r.data.session && r.data.session.user && r.data.session.user.id)));
          if(uid) return api.checkAdmin(uid);
          return sb.auth.getUser().then(function(u){ if(!u.data || !u.data.user) throw new Error('Não foi possível entrar com Face ID.'); return api.checkAdmin(u.data.user.id); });
        });
      },
      registerPasskey:function(){
        if(!sb.auth.registerPasskey) return Promise.reject(new Error('Este navegador ou esta versão ainda não suporta Face ID.'));
        return sb.auth.registerPasskey().then(function(r){ if(r.error) throw new Error('Não foi possível ativar o Face ID: '+(r.error.message||'tente de novo.')); return true; });
      },
      logout:function(){ return sb.auth.signOut(); },
      load:function(){
        return Promise.all([
          sb.from('admin_pro_queue').select('*').order('created_at',{ascending:false}),
          sb.from('service_requests').select('id,title,status,created_at,categories(name)').order('created_at',{ascending:false}).limit(100),
          sb.from('disputes').select('id,reason,status,created_at,service_requests(title)').order('created_at',{ascending:false}).limit(100),
          sb.from('payouts').select('id,amount_cents,pix_key,status,requested_at,pro_profiles(profiles(name))').order('requested_at',{ascending:false}).limit(100)
        ]).then(function(r){ state.pros=need(r[0])||[]; state.reqs=need(r[1])||[]; state.disputes=need(r[2])||[]; state.payouts=need(r[3])||[];
          return sb.rpc('admin_negotiations').then(function(n){ state.negs = n.error ? [] : (n.data||[]); state.negsErr = n.error ? n.error.message : ''; });
        }).then(function(){
          return Promise.all([
            sb.rpc('admin_overview'), sb.rpc('admin_reports'),
            sb.from('categories').select('id,name,active').order('name'),
            sb.from('regions').select('id,city,name,active').order('city').order('name')
          ]).then(function(r){
            state.ov = r[0].error ? null : r[0].data; state.ovErr = r[0].error ? r[0].error.message : '';
            state.reports = r[1].error ? [] : (r[1].data||[]); state.reportsErr = r[1].error ? r[1].error.message : '';
            state.cats = r[2].error ? [] : (r[2].data||[]); state.regs = r[3].error ? [] : (r[3].data||[]);
          });
        });
      },
      docUrl:function(path){ return sb.storage.from('documentos').createSignedUrl(path,120).then(function(r){ if(r.error||!r.data) throw new Error('Não foi possível abrir o documento.'); return r.data.signedUrl; }); },
      markPaid:function(id){ return sb.rpc('admin_mark_paid',{p_request:id,p_method:'pix'}).then(need); },
      setPro:function(id,status){ return sb.rpc('set_pro_status',{p_pro:id,p_status:status}).then(need); },
      resolve:function(id,outcome,note){ return sb.rpc('resolve_dispute',{p_dispute:id,p_outcome:outcome,p_note:note}).then(need); },
      payout:function(id,status){ return sb.rpc(status==='paid'?'mark_payout_paid':'mark_payout_failed',{p_payout:id}).then(need); },
      addCat:function(n){ return sb.from('categories').insert({name:n,active:true}).then(function(r){ if(r.error) throw new Error(/duplicate|unique/i.test(r.error.message)?'Essa categoria já existe.':r.error.message); }); },
      addReg:function(c,n){ return sb.from('regions').insert({city:c,name:n,active:true}).then(function(r){ if(r.error) throw new Error(/duplicate|unique/i.test(r.error.message)?'Esse bairro já existe nessa cidade.':r.error.message); }); },
      toggle:function(t,id,on){ return sb.from(t==='cat'?'categories':'regions').update({active:on}).eq('id',id).then(function(r){ if(r.error) throw new Error(r.error.message); }); },
      report:function(id,st,note){ return sb.rpc('resolve_report',{p_report:id,p_status:st,p_note:note||null}).then(need); }
    };
  }

  /* ---------------------------------------------------------- telas */
  function renderLogin(msg){
    $app.innerHTML =
      (LIVE ? '' : '<div class="demo">Modo demonstração: os dados são de exemplo e nada é salvo.</div>') +
      '<form class="login" id="loginForm"><div class="logo" style="font-size:28px">Resolvo<b>Já</b></div>' +
      '<p style="color:var(--muted);margin:8px 0 0">Painel da equipe</p>' +
      (LIVE ? '<label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>' +
              '<label for="pass">Senha</label><input id="pass" type="password" autocomplete="current-password" required>' : '') +
      '<button class="btn" type="submit">' + (LIVE ? 'Entrar' : 'Ver demonstração') + '</button>' +
      (LIVE ? '<button class="btn ghost" type="button" id="pk" style="width:100%;margin-top:10px">Entrar com Face ID</button>' : '') +
      (LIVE ? '<p style="text-align:center;margin:14px 0 0"><a href="#" id="forgot" style="color:var(--blue,#1F3BD1);font-weight:700">Esqueci minha senha</a></p>' : '') +
      '<div class="msg" id="loginMsg" role="alert">' + esc(msg||'') + '</div></form>';
    var pk = document.getElementById('pk');
    if(pk) pk.addEventListener('click', function(){
      var m = document.getElementById('loginMsg'); m.textContent='';
      api.loginPasskey().then(function(u){ state.user=u; return api.load(); }).then(renderApp).catch(function(err){ m.textContent = err.message; });
    });
    var fg = document.getElementById('forgot');
    if(fg) fg.addEventListener('click', function(e){
      e.preventDefault();
      var m = document.getElementById('loginMsg'), em = document.getElementById('email').value.trim();
      if(!em){ m.textContent='Digite seu e-mail acima e clique de novo em "Esqueci minha senha".'; return; }
      sb.auth.resetPasswordForEmail(em,{redirectTo: location.origin + '/app/'}).then(function(r){
        m.textContent = r.error ? 'Não foi possível enviar agora. Tente de novo em alguns minutos.' : 'Pronto! Se este e-mail existir, enviamos um link. Confira também o spam.';
      });
    });
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var email = LIVE ? document.getElementById('email').value.trim() : '';
      var pass = LIVE ? document.getElementById('pass').value : '';
      var m = document.getElementById('loginMsg'); m.textContent='';
      api.login(email,pass).then(function(u){ state.user=u; return api.load(); }).then(renderApp)
        .catch(function(err){ m.textContent = err.message; });
    });
  }

  function counts(){
    return {
      cadastros: state.pros.filter(function(p){return p.status==='pending';}).length,
      pedidos: state.reqs.filter(function(r){return r.status==='disputed';}).length,
      disputas: state.disputes.filter(function(d){return d.status==='open';}).length,
      saques: state.payouts.filter(function(p){return p.status==='requested';}).length,
      negs: state.negs.filter(function(n){return n.status==='awaiting_payment';}).length,
      denuncias: state.reports.filter(function(r){return r.status==='open'||r.status==='reviewing';}).length
    };
  }

  function renderApp(){
    var c = counts();
    var tabs = [['visao','Visão geral',null],['cadastros','Cadastros',c.cadastros],['negociacoes','Negociações',c.negs],['pedidos','Pedidos',null],['catreg','Categorias e regiões',null],['disputas','Disputas',c.disputas],['denuncias','Denúncias',c.denuncias],['saques','Saques',c.saques]];
    var open = state.payouts.filter(function(p){return p.status==='requested';}).reduce(function(a,p){return a+p.amount_cents;},0);
    $app.innerHTML =
      (LIVE ? '' : '<div class="demo">Modo demonstração: os dados são de exemplo e nada é salvo.</div>') +
      '<header class="top"><div class="wrap"><div class="bar"><div class="logo">Resolvo<b>Já</b></div><span class="tag">Painel da equipe</span><span class="sp"></span>' +
      '<span style="color:var(--muted);font-size:14px">'+esc(state.user.name)+'</span><button class="btn ghost" id="pkreg">Ativar Face ID</button><button class="btn ghost" id="out">Sair</button></div>' +
      '<nav class="tabs" role="tablist">' + tabs.map(function(t){
        return '<button class="tab" role="tab" aria-selected="'+(state.tab===t[0])+'" data-tab="'+t[0]+'">'+t[1]+(t[2]===null?'':' <span class="count'+(t[2]?'':' zero')+'">'+t[2]+'</span>')+'</button>';
      }).join('') + '</nav></div></header>' +
      '<main class="wrap"><div class="kpis">' +
        kpi('Cadastros para verificar', c.cadastros) + kpi('Negociações a pagar', c.negs) + kpi('Pedidos em disputa', c.pedidos) +
        kpi('Disputas abertas', c.disputas) + kpi('Saques a pagar', money(open)) +
      '</div><section id="view"></section></main>';
    var pkr = document.getElementById('pkreg');
    if(pkr){ if(!LIVE) pkr.style.display='none'; else pkr.addEventListener('click', function(){ api.registerPasskey().then(function(){ alert('Face ID ativado neste aparelho. Na próxima vez, use "Entrar com Face ID".'); }).catch(function(err){ alert(err.message); }); }); }
    document.getElementById('out').addEventListener('click', function(){ api.logout().then(function(){ state.user=null; renderLogin(); }); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function(b){ b.addEventListener('click', function(){ state.tab=b.getAttribute('data-tab'); renderApp(); }); });
    renderView();
  }
  function wa(phone,msg){
    var d=String(phone||'').replace(/\D/g,''); if(d.length<10) return '';
    if(d.indexOf('55')!==0) d='55'+d;
    return ' <a class="btn ghost" style="padding:4px 10px;font-size:13px" target="_blank" rel="noopener" href="https://wa.me/'+d+'?text='+encodeURIComponent(msg)+'">WhatsApp</a>';
  }
  function kpi(l,v,sub){ return '<div class="kpi"><span>'+esc(l)+'</span><b>'+esc(v)+'</b>'+(sub?'<small style="color:var(--muted)">'+esc(sub)+'</small>':'')+'</div>'; }
  function pct(v){ return v==null ? '—' : v+'%'; }
  function empty(t,s){ return '<div class="empty"><b>'+esc(t)+'</b>'+esc(s)+'</div>'; }

  function renderView(){
    var v = document.getElementById('view'), h='';
    if(state.tab==='visao'){
      var o = state.ov;
      h = '<h2>Visão geral</h2><p class="sub">Números reais do banco. Porcentagens consideram os pedidos dos últimos 30 dias (sem os cancelados).</p>';
      if(!o) h += '<p class="sub" style="color:var(--err,#B3261E)">Não foi possível carregar'+(state.ovErr?': '+esc(state.ovErr):'')+'. Confira se a migração 010 foi rodada no Supabase.</p>';
      else {
        var diff = o.orders_prev_week>0 ? Math.round(100*(o.orders_week-o.orders_prev_week)/o.orders_prev_week) : null;
        h += '<div class="kpis">' +
          kpi('Pedidos na semana', o.orders_week, diff==null ? 'semana anterior: '+o.orders_prev_week : (diff>=0?'+':'')+diff+'% vs. semana anterior') +
          kpi('Pedidos com proposta', pct(o.with_proposal_pct), 'de '+o.orders_30d+' pedidos em 30 dias') +
          kpi('Contratações', o.hires_30d, pct(o.hires_pct)+' dos pedidos em 30 dias') +
          kpi('Comissão estimada', money(o.commission_cents), '10% de '+money(o.gmv_cents)+' contratados') +
          kpi('Clientes que voltaram', pct(o.repeat_pct), o.repeat_clients+' de '+o.hired_clients+' com 2ª contratação') +
          kpi('Profissionais aprovados', o.pros_approved, o.pros_pending+' aguardando aprovação') +
          kpi('Clientes cadastrados', o.clients_total) +
          kpi('Denúncias abertas', o.reports_open) + '</div>' +
          '<p class="sub">A comissão é estimada: 10% do valor das propostas aceitas em pedidos já em andamento ou concluídos. O valor realmente recebido está no Mercado Pago.</p>';
      }
    } else if(state.tab==='catreg'){
      h = '<h2>Categorias e regiões</h2><p class="sub">Só aparece para clientes e profissionais o que estiver ativo. Desativar não apaga pedidos antigos.</p>';
      h += '<h3 style="margin:18px 0 8px">Categorias de serviço</h3>' +
        '<form class="resolve" id="addCat" style="grid-template-columns:1fr auto;margin-bottom:12px;max-width:480px"><input id="catName" placeholder="Nova categoria (ex.: Pedreiro)" maxlength="40" aria-label="Nome da nova categoria"><button class="btn" type="submit">Adicionar</button></form>' +
        (state.cats.length ? '<div class="tw"><table><thead><tr><th>Categoria</th><th>Status</th><th>Ação</th></tr></thead><tbody>' + state.cats.map(function(x){
          return '<tr><td><b>'+esc(x.name)+'</b></td><td>'+(x.active?'<span class="pill ok">Ativa</span>':'<span class="pill warn">Desativada</span>')+'</td><td><button class="btn ghost" data-tg="cat" data-id="'+esc(x.id)+'" data-on="'+(x.active?'0':'1')+'">'+(x.active?'Desativar':'Ativar')+'</button></td></tr>';
        }).join('') + '</tbody></table></div>' : empty('Nenhuma categoria','Adicione a primeira acima.'));
      h += '<h3 style="margin:26px 0 8px">Cidades e bairros atendidos</h3>' +
        '<form class="resolve" id="addReg" style="grid-template-columns:1fr 1fr auto;margin-bottom:12px;max-width:640px"><input id="regCity" placeholder="Cidade (ex.: Serra)" maxlength="40" aria-label="Cidade"><input id="regName" placeholder="Bairro (ex.: Laranjeiras)" maxlength="60" aria-label="Bairro"><button class="btn" type="submit">Adicionar</button></form>' +
        (state.regs.length ? '<div class="tw"><table><thead><tr><th>Cidade</th><th>Bairro</th><th>Status</th><th>Ação</th></tr></thead><tbody>' + state.regs.map(function(x){
          return '<tr><td>'+esc(x.city)+'</td><td><b>'+esc(x.name)+'</b></td><td>'+(x.active?'<span class="pill ok">Ativo</span>':'<span class="pill warn">Desativado</span>')+'</td><td><button class="btn ghost" data-tg="reg" data-id="'+esc(x.id)+'" data-on="'+(x.active?'0':'1')+'">'+(x.active?'Desativar':'Ativar')+'</button></td></tr>';
        }).join('') + '</tbody></table></div>' : empty('Nenhum bairro','Adicione o primeiro acima.'));
    } else if(state.tab==='denuncias'){
      h = '<h2>Denúncias</h2><p class="sub">Clientes e profissionais denunciam pelo app. Abra o WhatsApp para ouvir as duas partes e depois registre a decisão.</p>';
      if(state.reportsErr) h += '<p class="sub" style="color:var(--err,#B3261E)">Não foi possível carregar: '+esc(state.reportsErr)+'. Confira se a migração 010 foi rodada no Supabase.</p>';
      h += state.reports.length ? '<div class="tw"><table><thead><tr><th>Quem denunciou</th><th>Contra</th><th>Motivo</th><th>Quando</th><th>Status</th><th>Decisão da equipe</th></tr></thead><tbody>' +
        state.reports.map(function(r){
          var act = r.status==='open'||r.status==='reviewing';
          return '<tr><td><b>'+esc(r.reporter_name)+'</b><small>'+esc(r.reporter_phone||'')+'</small>'+wa(r.reporter_phone,'Olá, '+r.reporter_name+'! Aqui é do Resolvo Já. Recebemos sua denúncia e queremos entender melhor o que aconteceu.')+'</td>' +
            '<td>'+(r.target_name?'<b>'+esc(r.target_name)+'</b><small>'+esc(r.target_phone||'')+'</small>'+wa(r.target_phone,'Olá, '+r.target_name+'! Aqui é do Resolvo Já. Recebemos uma reclamação sobre um serviço e gostaríamos de ouvir a sua versão.'):'<small>não informado</small>')+'<small>'+esc(r.request_title||'')+'</small></td>' +
            '<td style="max-width:280px">'+esc(r.reason)+(r.resolution?'<small>Decisão: '+esc(r.resolution)+'</small>':'')+'</td><td class="num">'+esc(when(r.created_at))+'</td><td>'+pill(STATUS_REPORT,r.status)+'</td><td>' +
            (act ? '<div class="resolve"><input id="rn-'+esc(r.id)+'" placeholder="Explique a decisão" aria-label="Explicação da decisão"><div class="acts">' +
              (r.status==='open' ? '<button class="btn ghost" data-rep="'+esc(r.id)+'" data-to="reviewing">Em análise</button>' : '') +
              '<button class="btn" data-rep="'+esc(r.id)+'" data-to="actioned">Resolvida</button><button class="btn ghost" data-rep="'+esc(r.id)+'" data-to="dismissed">Arquivar</button></div></div>' : '') +
            '</td></tr>';
        }).join('') + '</tbody></table></div>' : empty('Nenhuma denúncia','Quando alguém denunciar um pedido ou usuário pelo app, aparece aqui.');
    } else if(state.tab==='cadastros'){
      var list = state.pros.slice().sort(function(a,b){ return (a.status==='pending'?0:1)-(b.status==='pending'?0:1); });
      h = '<h2>Cadastros de profissionais</h2><p class="sub">Aprove só depois de conferir o documento. Sem o aceite do termo, o banco não deixa aprovar.</p>';
      h += list.length ? '<div class="tw"><table><thead><tr><th>Profissional</th><th>Categorias</th><th>Experiência</th><th>Termo</th><th>Documento</th><th>Enviado</th><th>Status</th><th>Ação</th></tr></thead><tbody>' +
        list.map(function(p){
          var pend = p.status==='pending';
          return '<tr><td><b>'+esc(p.name)+'</b><small>'+esc(p.phone||'')+'</small></td><td>'+esc(p.categories||'')+'</td><td class="num">'+esc(p.years_exp==null?'':p.years_exp+' anos')+'</td>' +
            '<td>'+(p.accepted_terms?'<span class="pill ok">Aceito</span>':'<span class="pill err">Não aceito</span>')+'</td><td>'+(p.document_path?'<button class="btn ghost" data-doc="'+esc(p.document_path)+'">Ver documento</button>':'<small>sem documento</small>')+'</td><td class="num">'+esc(when(p.created_at))+'</td><td>'+pill(STATUS_PRO,p.status)+'</td>' +
            '<td><div class="acts">' +
              (p.status!=='approved' ? '<button class="btn" data-pro="'+esc(p.user_id)+'" data-to="approved"'+(p.accepted_terms?'':' disabled title="O profissional ainda não aceitou o termo"')+'>Aprovar</button>' : '') +
              (p.status==='pending' ? '<button class="btn ghost" data-pro="'+esc(p.user_id)+'" data-to="suspended">Recusar</button>' : '') +
              (p.status==='approved' ? '<button class="btn ghost" data-pro="'+esc(p.user_id)+'" data-to="suspended">Suspender</button>' : '') +
            '</div></td></tr>';
        }).join('') + '</tbody></table></div>' : empty('Nenhum cadastro ainda','Os profissionais aparecem aqui assim que se cadastrarem.');
    } else if(state.tab==='negociacoes'){
      h = '<h2>Negociações</h2><p class="sub">Pedidos em que o cliente já escolheu uma proposta. Combine o pagamento pelo WhatsApp e, quando receber, clique em “Marcar como pago”.</p>';
      if(state.negsErr) h += '<p class="sub" style="color:var(--err,#B3261E)">Não foi possível carregar: '+esc(state.negsErr)+'. Confira se a migração 006 foi rodada no Supabase.</p>';
      h += state.negs.length ? '<div class="tw"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Profissional</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead><tbody>' +
        state.negs.map(function(n){
          var wait = n.status==='awaiting_payment';
          var mc = 'Olá, '+n.client_name+'! Aqui é do Resolvo Já. Você escolheu a proposta de '+n.pro_name+' para "'+n.title+'" ('+money(n.amount_cents)+'). Vamos combinar o pagamento?';
          var mp = 'Olá, '+n.pro_name+'! Aqui é do Resolvo Já. O cliente aceitou sua proposta para "'+n.title+'" ('+money(n.amount_cents)+'). Estamos combinando o pagamento e já te avisamos para seguir.';
          return '<tr><td><b>'+esc(n.title)+'</b><small>'+esc(n.category)+' · '+esc(n.bairro)+' · '+esc(when(n.accepted_at))+'</small></td>' +
            '<td>'+esc(n.client_name)+'<small>'+esc(n.client_phone||'sem telefone')+'</small>'+wa(n.client_phone,mc)+'</td>' +
            '<td>'+esc(n.pro_name)+'<small>'+esc(n.pro_phone||'sem telefone')+'</small>'+wa(n.pro_phone,mp)+'</td>' +
            '<td class="num">'+esc(money(n.amount_cents))+'<small>comissão '+esc(money(Math.round(n.amount_cents/10)))+'</small></td>' +
            '<td>'+(wait?'<span class="pill warn">Aguardando pagamento</span>':'<span class="pill ok">Pago · em andamento</span>')+'</td>' +
            '<td>'+(wait?'<button class="btn" data-paid="'+esc(n.request_id)+'">Marcar como pago</button>':'')+'</td></tr>';
        }).join('') + '</tbody></table></div>' : empty('Nenhuma negociação','Quando um cliente aceitar uma proposta, ela aparece aqui e você recebe um e-mail.');
    } else if(state.tab==='pedidos'){
      h = '<h2>Pedidos</h2><p class="sub">Os 100 mais recentes. Pedidos em disputa aparecem marcados.</p>';
      h += state.reqs.length ? '<div class="tw"><table><thead><tr><th>Pedido</th><th>Categoria</th><th>Criado</th><th>Status</th></tr></thead><tbody>' +
        state.reqs.map(function(r){ return '<tr><td><b>'+esc(r.title)+'</b></td><td>'+esc(r.categories&&r.categories.name||'')+'</td><td class="num">'+esc(when(r.created_at))+'</td><td>'+pill(STATUS_REQ,r.status)+'</td></tr>'; }).join('') +
        '</tbody></table></div>' : empty('Nenhum pedido ainda','Quando os clientes pedirem serviços, eles aparecem aqui.');
    } else if(state.tab==='disputas'){
      h = '<h2>Disputas</h2><p class="sub">Enquanto a disputa estiver aberta, o valor fica retido e a confirmação automática não roda.</p>';
      h += state.disputes.length ? '<div class="tw"><table><thead><tr><th>Pedido</th><th>Motivo</th><th>Aberta</th><th>Status</th><th>Decisão da equipe</th></tr></thead><tbody>' +
        state.disputes.map(function(d){
          var isOpen = d.status==='open';
          return '<tr><td><b>'+esc(d.service_requests&&d.service_requests.title||'')+'</b></td><td style="max-width:300px">'+esc(d.reason)+'</td><td class="num">'+esc(when(d.created_at))+'</td><td>'+pill(STATUS_DISPUTE,d.status)+'</td><td>' +
            (isOpen ? '<div class="resolve"><select aria-label="Decisão" id="o-'+esc(d.id)+'"><option value="resolved_refund">Reembolsar o cliente</option><option value="resolved_release">Liberar ao profissional</option><option value="resolved_partial">Parcial (estorno manual)</option></select>' +
              '<input id="n-'+esc(d.id)+'" placeholder="Explique a decisão" aria-label="Explicação da decisão"><button class="btn" data-disp="'+esc(d.id)+'">Decidir</button></div>' : '') +
            '</td></tr>';
        }).join('') + '</tbody></table></div>' : empty('Nenhuma disputa','Quando um cliente ou profissional abrir uma disputa, ela aparece aqui.');
    } else {
      h = '<h2>Saques</h2><p class="sub">Faça o Pix para a chave informada e depois marque o saque como pago. Recusar devolve o valor ao saldo do profissional.</p>';
      h += state.payouts.length ? '<div class="tw"><table><thead><tr><th>Profissional</th><th>Valor</th><th>Chave Pix</th><th>Pedido em</th><th>Status</th><th>Ação</th></tr></thead><tbody>' +
        state.payouts.map(function(p){
          var nm = p.pro_profiles&&p.pro_profiles.profiles&&p.pro_profiles.profiles.name || '';
          return '<tr><td><b>'+esc(nm)+'</b></td><td class="num"><b>'+esc(money(p.amount_cents))+'</b></td><td>'+esc(p.pix_key)+'</td><td class="num">'+esc(when(p.requested_at))+'</td><td>'+pill(STATUS_PAYOUT,p.status)+'</td><td>' +
            (p.status==='requested' ? '<div class="acts"><button class="btn" data-pay="'+esc(p.id)+'" data-to="paid">Marcar como pago</button><button class="btn ghost" data-pay="'+esc(p.id)+'" data-to="failed">Recusar</button></div>' : '') +
            '</td></tr>';
        }).join('') + '</tbody></table></div>' : empty('Nenhum saque pedido','Os pedidos de saque dos profissionais aparecem aqui.');
    }
    v.innerHTML = h;

    function run(p,okMsg){
      p.then(function(){ toast(okMsg); return api.load(); }).then(renderApp).catch(function(e){ toast(e.message||'Não foi possível concluir.', true); });
    }
    Array.prototype.forEach.call(v.querySelectorAll('[data-paid]'), function(b){
      b.addEventListener('click', function(){
        if(!window.confirm('Você já recebeu o pagamento deste pedido? Isso libera o início do serviço e não pode ser desfeito aqui.')) return;
        b.disabled=true; run(api.markPaid(b.getAttribute('data-paid')), 'Pagamento registrado. Pedido em andamento.');
      });
    });
    Array.prototype.forEach.call(v.querySelectorAll('[data-doc]'), function(b){
      b.addEventListener('click', function(){
        var w = window.open('', '_blank');
        api.docUrl(b.getAttribute('data-doc')).then(function(u){ if(w){ w.location = u; } }).catch(function(e){ if(w) w.close(); toast(e.message||'Não foi possível abrir o documento.', true); });
      });
    });
    Array.prototype.forEach.call(v.querySelectorAll('[data-pro]'), function(b){
      b.addEventListener('click', function(){ var to=b.getAttribute('data-to'); b.disabled=true;
        run(api.setPro(b.getAttribute('data-pro'), to), to==='approved'?'Profissional aprovado':to==='suspended'?'Cadastro atualizado':'Feito'); });
    });
    Array.prototype.forEach.call(v.querySelectorAll('[data-disp]'), function(b){
      b.addEventListener('click', function(){
        var id=b.getAttribute('data-disp'), note=document.getElementById('n-'+id).value.trim();
        if(!note){ toast('Explique a decisão antes de continuar.', true); document.getElementById('n-'+id).focus(); return; }
        b.disabled=true; run(api.resolve(id, document.getElementById('o-'+id).value, note), 'Disputa decidida');
      });
    });
    var fc = v.querySelector('#addCat');
    if(fc) fc.addEventListener('submit', function(ev){ ev.preventDefault(); var n=document.getElementById('catName').value.trim();
      if(n.length<3){ toast('Digite o nome da categoria (mínimo de 3 letras).', true); return; } run(api.addCat(n), 'Categoria adicionada'); });
    var fr = v.querySelector('#addReg');
    if(fr) fr.addEventListener('submit', function(ev){ ev.preventDefault(); var c=document.getElementById('regCity').value.trim(), n=document.getElementById('regName').value.trim();
      if(c.length<2||n.length<2){ toast('Preencha a cidade e o bairro.', true); return; } run(api.addReg(c,n), 'Bairro adicionado'); });
    Array.prototype.forEach.call(v.querySelectorAll('[data-tg]'), function(b){
      b.addEventListener('click', function(){ var on=b.getAttribute('data-on')==='1'; b.disabled=true;
        run(api.toggle(b.getAttribute('data-tg'), +b.getAttribute('data-id'), on), on?'Ativado':'Desativado'); });
    });
    Array.prototype.forEach.call(v.querySelectorAll('[data-rep]'), function(b){
      b.addEventListener('click', function(){
        var id=b.getAttribute('data-rep'), to=b.getAttribute('data-to'), note=document.getElementById('rn-'+id).value.trim();
        if(to!=='reviewing' && note.length<3){ toast('Explique a decisão antes de continuar.', true); document.getElementById('rn-'+id).focus(); return; }
        b.disabled=true; run(api.report(id,to,note), to==='reviewing'?'Denúncia em análise':'Denúncia atualizada');
      });
    });
    Array.prototype.forEach.call(v.querySelectorAll('[data-pay]'), function(b){
      b.addEventListener('click', function(){ var to=b.getAttribute('data-to'); b.disabled=true;
        run(api.payout(b.getAttribute('data-pay'), to), to==='paid'?'Saque marcado como pago':'Saque recusado'); });
    });
  }

  /* ---------------------------------------------------------- início */
  if(LIVE){ api.init().then(function(){ renderLogin(); }).catch(function(e){ renderLogin(e.message); }); }
  else { renderLogin(); }
})();
</script>
</body>
</html>
