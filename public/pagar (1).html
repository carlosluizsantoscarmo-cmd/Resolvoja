<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Verificação de profissional · Resolvo Já</title>
<style>
:root{--bg:#F3F5FC;--surface:#fff;--text:#121A3A;--muted:#566080;--line:#D9DDEE;--brand:#1F3BD1;--brand-ink:#fff;--err:#A12626;--err-bg:#FBE3E3}
@media (prefers-color-scheme:dark){:root{--bg:#0D1230;--surface:#151B3E;--text:#EEF0FA;--muted:#A3ABCF;--line:#283062;--brand:#8FA2FF;--brand-ink:#0D1230;--err:#FF9B9B;--err-bg:#431B1B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 48px}
a.brand{color:var(--text);font-weight:800;text-decoration:none;font-size:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
h1{font-size:24px;margin:0 0 4px}
.price{font-size:30px;font-weight:800;margin:6px 0 14px}
label{display:block;font-weight:600;font-size:15px;margin:12px 0 4px}
input[type=text],input[type=email]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
button{width:100%;margin-top:18px;font:inherit;font-weight:700;padding:13px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{background:var(--err-bg);color:var(--err);border-radius:10px;padding:10px 12px;margin-top:14px;display:none}
.muted{color:var(--muted);font-size:14px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<a class="brand" href="/">Resolvo Já</a>
<form class="card" id="f" novalidate>
  <h1 id="titulo">Verificação de profissional</h1>
  <div class="price" id="preco">R$ 29,90</div>
  <label for="nome">Nome completo</label>
  <input id="nome" type="text" autocomplete="name" maxlength="100" required>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="email" maxlength="120" required>
  <div class="hp" aria-hidden="true"><label for="website">Não preencha</label><input id="website" type="text" tabindex="-1" autocomplete="off"></div>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Pagar com Mercado Pago</button>
  <p class="muted">Você será levado ao Mercado Pago para concluir o pagamento com Pix, cartão ou saldo. Não guardamos dados do seu cartão. Você tem 7 dias para desistir e receber o reembolso. Veja os <a href="/termos.html">Termos e reembolso</a> e a <a href="/privacidade.html">Política de Privacidade</a>.</p>
</form>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var ITEM='cadastro-pro';
  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var err=$('err'),go=$('go');err.style.display='none';
    var nome=$('nome').value.trim(),email=$('email').value.trim();
    if(!nome){err.textContent='Informe seu nome.';err.style.display='block';$('nome').focus();return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){err.textContent='Confira o e-mail.';err.style.display='block';$('email').focus();return}
    go.disabled=true;go.textContent='Abrindo o Mercado Pago…';
    fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:ITEM,nome:nome,email:email,website:$('website').value})})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})})
      .then(function(x){
        if(x.ok&&x.d.url){location.href=x.d.url;return}
        throw new Error(x.d.error||'Não foi possível iniciar o pagamento.');
      })
      .catch(function(ex){err.textContent=ex.message||'Erro de conexão. Tente de novo.';err.style.display='block';go.disabled=false;go.textContent='Pagar com Mercado Pago'});
  });
})();
</script>
</body>
</html>
